<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1a1f" />
    <title>聊聊你和 AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1 class="brand" id="brand-title">聊聊你和 AI</h1>
        <p id="brand-sub">匿名、轻松，大约 2 分钟。没有对错，想听真实感受。</p>
        <div class="progress-wrap" id="form-progress">
          <div class="progress-meta">
            <span>进度</span>
            <span id="progress-text">已完成 0 / 0</span>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <span id="progress-fill"></span>
          </div>
        </div>
      </header>

      <div class="card" id="form-view">
        <form id="survey-form" novalidate>
          <div id="questions"></div>
          <p class="error" id="form-error" role="alert"></p>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">提交，谢谢！</button>
          </div>
          <p class="hint">带 * 的是必答。提交后主持页会自动收到。</p>
        </form>
      </div>

      <div class="card done" id="done-view" hidden>
        <h2>收到了，谢谢</h2>
        <p class="hint" id="done-msg" style="margin: 0">已经收到啦，谢谢你抽空分享。</p>
        <div id="fallback-box" hidden>
          <div class="payload" id="payload-text"></div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="copy-payload">复制给主持</button>
          </div>
        </div>
      </div>
    </main>

    <script src="js/survey-config.js"></script>
    <script src="js/backend-config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
